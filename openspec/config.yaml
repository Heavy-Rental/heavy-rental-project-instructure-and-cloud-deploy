# OpenSpec project config for Heavy Rental AWS Academy (Vocareum) infra CD.
schema: spec-driven
context: |
  This repository specifies GitHub Actions that create and operate the
  Academy Learner Lab (Vocareum) estate. Branch 1 (feat/infra-academy-bootstrap)
  only authenticates to Vocareum, bootstraps remote Terraform state, and
  terraform plans an empty estate. It does not create a VPC and is not paid/OIDC.
