# OpenSpec project config for Heavy Rental AWS Academy (Vocareum) infra CD.
schema: spec-driven
context: |
  This repository specifies GitHub Actions that create and operate the
  Academy Learner Lab (Vocareum) estate.
  Terraform creates architecture and resources (VPC, two NAT Gateways,
  four ASGs, ALBs, two Multi-AZ RDS, Bolt NLB, empty SM shells).
  Ansible only configures existing guests (Docker, .env, compose).
  Four delivered changes: add-infra-academy-bootstrap, add-infra-academy-estate,
  add-infra-academy-configure, add-infra-academy-deploy-projects.
  Not paid/OIDC. Day-to-day portal/REST/Haystack rolls are app CD (other repo).
  Infra action=deploy-projects is a later first-compose of site.yml after apply.
