# OpenSpec project config for Heavy Rental Academy and paid infra CD.
schema: spec-driven
context: |
  This repository specifies GitHub Actions that create and operate the
  estate on AWS Academy / Vocareum and on a billed AWS account.
  Terraform creates architecture and resources (VPC, two NAT Gateways,
  four app ASGs plus hr-bastion (single EC2), ALBs, two Multi-AZ RDS, Bolt NLB,
  empty SM shells, CloudWatch alarms/dashboard, CloudTrail to S3).
  Ansible only configures existing guests (Docker, .env, compose).
  Changes include add-infra-paid-pipeline (dedicated aws-infra-paid.yml OIDC
  Action with its own jobs; academy.yml is Vocareum-only with its own jobs).
  add-infra-academy-bootstrap, add-infra-academy-estate,
  add-infra-academy-configure, add-infra-academy-deploy-projects,
  add-infra-academy-observe, add-infra-paid-profile (superseded in part).
  REST ALB is internet-facing :8080. Haystack stays internal.
  tg-rest health is GET <instance>:8080/actuator/health matcher 200-299 (2xx).
  Spring Security 4xx only on authentication exceptions; GET / 401 is not healthy.
  tg-haystack health is GET <instance>:8000/health matcher 200-299 (2xx).
  CORS includes portal and REST ALB origins. Paid Ansible uses a dedicated
  SSM bucket (not tfstate). Academy observe uses Vocareum LabRole only
  (no aws_iam_role). Trail is S3-only (heavy-rental-academy or -actual).
  Day-to-day portal/REST/Haystack rolls are app CD in
  heavy-rental-project-pipeline-development (academy and paid callers).
  Infra action=deploy-projects is a later first-compose of site.yml after apply.
  Haystack workers (ADR 0020): postgres:17 + sync-from-primary.sh and
  python:3.12-slim + populate_neo4j.py. Not uvicorn -m. Compose :8089 only.
  sg-rds allows :5432 to itself for postgres_fdw.
  Maintenance bastion hr-bastion (ADR 0021): single EC2 in a public
  subnet; SSH to app guests from sg-bastion only; no :22 from 0.0.0.0/0.
