---
- name: REST image is required
  ansible.builtin.assert:
    that:
      - rest_image | default('') | length > 0
    fail_msg: >-
      Set extra-var rest_image (ECR/GHCR tag or name loaded from image_http_url).
      Do not docker build on the guest.

- name: REST compose
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ compose_dir }}/compose.yml"
    mode: "0644"

- name: Compose REST
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ env_path }}"
      - -f
      - "{{ compose_dir }}/compose.yml"
      - up
      - -d
      - --remove-orphans
    chdir: "{{ compose_dir }}"

# ALB tg-rest waits for GET <instance>:8080/actuator/health matcher 200-299.
# Spring Security 401s GET / — that 4xx must not count as healthy.
- name: REST must answer 2xx on :8080/actuator/health
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/actuator/health
    status_code: "{{ range(200, 300) | list }}"
  register: rest_live
  retries: 30
  delay: 5
  until: rest_live is succeeded
