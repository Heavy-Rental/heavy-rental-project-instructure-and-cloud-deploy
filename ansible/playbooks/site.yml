---
# Full first-compose of portal + REST + Haystack + Neo4j + rds_logical.
# Invoked only by action=deploy-projects (a later workflow run after apply
# or configure-only). apply / configure-only use configure.yml and never
# call this file. Image tags come from group_vars (PORTAL_IMAGE / REST_IMAGE /
# HAYSTACK_IMAGE). Preflight forbids stock nginx, empty REST/Haystack, private
# GHCR, and image_http_url.
- name: Shared guest bootstrap
  hosts: portal:rest:haystack:neo4j
  become: true
  gather_facts: true
  roles:
    - guest_base

- name: Portal (React / nginx)
  hosts: portal
  become: true
  roles:
    - portal

- name: Neo4j
  hosts: neo4j
  become: true
  roles:
    - neo4j

- name: REST (Spring Boot / Tomcat)
  hosts: rest
  become: true
  roles:
    - rest

- name: Haystack (no Neo4j container)
  hosts: haystack
  become: true
  roles:
    - haystack

# run_once is wrong if RDS has no pgvector: each haystack guest needs the
# local container fallback. CREATE EXTENSION IF NOT EXISTS is idempotent.
- name: RDS logical (Haystack vector extension)
  hosts: haystack
  become: true
  roles:
    - rds_logical
