# AWS infrastructure — billed account via GitHub OIDC (ADR 0017 / 0019).
# Academy / Vocareum: .github/workflows/aws-infra-academy.yml (separate job graph).
#
# Operator:
#   1. Environment AWS_ACTUAL: AWS_ROLE_TO_ASSUME (variable or secret). No AWS_ACCESS_KEY_ID.
#      Setup: docs/OIDC-PAID.md
#   2. Same app secrets as academy (SPRING_DATASOURCE_PASSWORD, Neo4j, Stripe trio).
#   3. Leave Vocareum form keys off this Action (they are not declared).
#   4. action=plan | apply | configure-only | deploy-projects | stop | destroy

name: AWS infrastructure (paid)

on:
  workflow_dispatch:
    inputs:
      action:
        description: plan, apply, configure-only, deploy-projects (after apply), stop, or destroy. destroy also needs confirm_destroy=destroy.
        required: true
        type: choice
        default: plan
        options:
          - plan
          - bootstrap
          - apply
          - configure-only
          - deploy-projects
          - stop
          - destroy
      aws_environment:
        description: Must be AWS_ACTUAL (billed account, GitHub OIDC).
        required: true
        type: environment
        default: AWS_ACTUAL
      confirm_destroy:
        description: For action=destroy, pick destroy here too. action=destroy alone is not enough. Leaves the state bucket.
        required: true
        type: choice
        default: "no"
        options:
          - "no"
          - destroy
      image_ref:
        description: Fallback registry tag for REST/Haystack if REST_IMAGE / HAYSTACK_IMAGE are empty. Does not set the portal image.
        required: false
        type: string
        default: ""
      image_http_url:
        description: HTTPS tar.gz to docker load on guests. Empty = Environment IMAGE_HTTP_URL.
        required: false
        type: string
        default: ""

concurrency:
  group: aws-infra-paid-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_DEFAULT_REGION: us-east-1
  DB_PASSWORD_PLAN_PLACEHOLDER: "PlanOnlyNotApplied1!"
  TF_VAR_deployment: actual
  DEPLOYMENT: actual

jobs:
  refuse-non-paid:
    name: Assert Environment AWS_ACTUAL
    runs-on: ubuntu-latest
    environment: ${{ inputs.aws_environment }}
    timeout-minutes: 2
    steps:
      - name: Refuse Vocareum and unknown Environments
        env:
          ENV_NAME: ${{ inputs.aws_environment }}
          ENV_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          ROLE: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          set +x
          set -euo pipefail
          if [ "${ENV_NAME}" != "AWS_ACTUAL" ]; then
            echo "::error::This Action is billed AWS / OIDC only (got '${ENV_NAME}'). Use workflow AWS infrastructure (Academy) with Environment academy."
            exit 1
          fi
          if [ -n "${ENV_KEY}" ]; then
            echo "::error::Environment AWS_ACTUAL must not contain AWS_ACCESS_KEY_ID. Paid uses GitHub OIDC only."
            exit 1
          fi
          if [ -z "${ROLE}" ]; then
            echo "::error::Set Environment AWS_ACTUAL variable or secret AWS_ROLE_TO_ASSUME (IAM role ARN). See docs/OIDC-PAID.md. Do not put AWS access keys here."
            exit 1
          fi

  assert-lab:
    name: Assert AWS profile
    needs: [refuse-non-paid]
    runs-on: ubuntu-latest
    environment: AWS_ACTUAL
    timeout-minutes: 5
    outputs:
      account_id: ${{ steps.sts.outputs.account_id }}
      bucket: ${{ steps.sts.outputs.bucket }}
      ssm_bucket: ${{ steps.sts.outputs.ssm_bucket }}
      deployment: ${{ steps.sts.outputs.deployment }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/resolve-aws-profile
        with:
          profile: AWS_ACTUAL
          aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
          aws_role_to_assume: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}

      - name: Prove the AWS session
        id: sts
        env:
          PROFILE: AWS_ACTUAL
        run: |
          set -euo pipefail
          if ! ARN=$(aws sts get-caller-identity --query Arn --output text); then
            echo "::error::sts failed. Check Environment AWS_ACTUAL AWS_ROLE_TO_ASSUME / GitHub OIDC."
            exit 1
          fi
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=${ACCOUNT}" >> "$GITHUB_OUTPUT"
          echo "bucket=heavy-rental-tfstate-${ACCOUNT}-${DEPLOYMENT}" >> "$GITHUB_OUTPUT"
          echo "ssm_bucket=heavy-rental-ssm-${ACCOUNT}-${DEPLOYMENT}" >> "$GITHUB_OUTPUT"
          echo "deployment=${DEPLOYMENT}" >> "$GITHUB_OUTPUT"
          {
            echo "### AWS profile \`${PROFILE}\` (deployment \`${DEPLOYMENT}\`)"
            echo ""
            echo "Caller: \`${ARN}\`"
            echo "Account: \`${ACCOUNT}\`"
            echo "Action: \`${{ inputs.action }}\`"
            echo "State: \`s3://heavy-rental-tfstate-${ACCOUNT}-${DEPLOYMENT}/estate/terraform.tfstate\`"
          } >> "$GITHUB_STEP_SUMMARY"

  ensure-backend:
    name: Ensure S3 state backend
    needs: [assert-lab]
    if: inputs.action == 'plan' || inputs.action == 'bootstrap' || inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: AWS_ACTUAL
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/resolve-aws-profile
        with:
          profile: AWS_ACTUAL
          aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
          aws_role_to_assume: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Create backend if missing
        env:
          BUCKET: ${{ needs.assert-lab.outputs.bucket }}
        run: ./scripts/ensure-backend.sh "${BUCKET}"

  terraform:
    name: Terraform estate
    needs: [assert-lab, ensure-backend]
    if: always() && needs.assert-lab.result == 'success' && needs.ensure-backend.result == 'success' && (inputs.action == 'plan' || inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment: AWS_ACTUAL
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/resolve-aws-profile
        with:
          profile: AWS_ACTUAL
          aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
          aws_role_to_assume: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Resolve RDS master password
        env:
          DB_PASS: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          ACTION: ${{ inputs.action }}
        run: |
          set +x
          PLACEHOLDER="${DB_PASSWORD_PLAN_PLACEHOLDER}"
          if [ "${ACTION}" = "apply" ]; then
            if [ -z "${DB_PASS}" ] || [ "${DB_PASS}" = "${PLACEHOLDER}" ] || [ "${#DB_PASS}" -lt 8 ]; then
              echo "::error::Set Environment secret SPRING_DATASOURCE_PASSWORD (>= 8 chars) before action=apply. Do not put it on the Run form."
              exit 1
            fi
            PASS="${DB_PASS}"
          else
            # Plan must not fail validation if the secret is unset or shorter than 8.
            if [ -n "${DB_PASS}" ] && [ "${DB_PASS}" != "${PLACEHOLDER}" ] && [ "${#DB_PASS}" -ge 8 ]; then
              PASS="${DB_PASS}"
            else
              PASS="${PLACEHOLDER}"
            fi
          fi
          echo "::add-mask::${PASS}"
          echo "TF_VAR_db_master_password=${PASS}" >> "$GITHUB_ENV"

      - name: Resolve optional alarm email
        env:
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
        run: |
          set -euo pipefail
          echo "TF_VAR_alarm_email=${ALARM_EMAIL}" >> "$GITHUB_ENV"

      - name: terraform init
        env:
          BUCKET: ${{ needs.assert-lab.outputs.bucket }}
        working-directory: terraform/academy
        run: |
          set -euo pipefail
          chmod +x ../../scripts/estate-unlock.sh ../../scripts/reconcile-estate.sh
          ../../scripts/estate-unlock.sh "${BUCKET}"
          if ! terraform init -input=false -reconfigure \
            -backend-config="bucket=${BUCKET}" \
            -backend-config="key=estate/terraform.tfstate" \
            -backend-config="region=${AWS_DEFAULT_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"; then
            echo "::error::terraform init failed. Check S3 bucket ${BUCKET} (S3 native lockfile)."
            exit 1
          fi

      - name: Reconcile leftover AWS into state
        env:
          ESTATE_ON_VPC_FORK: fail
        working-directory: terraform/academy
        run: |
          set -euo pipefail
          chmod +x ../../scripts/reconcile-estate.sh
          ../../scripts/reconcile-estate.sh
          {
            echo "### Reconcile"
            echo ""
            echo "Imported any named leftovers (ASG / ECR / secrets / RDS / VPC) that were missing from state."
            echo "A second apply after a failed persist is safe when a single estate VPC remains."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: terraform plan
        env:
          BUCKET: ${{ needs.assert-lab.outputs.bucket }}
        working-directory: terraform/academy
        run: |
          set -euo pipefail
          set +e
          terraform plan -input=false -no-color -out=tfplan > /tmp/tfplan.out 2>&1
          rc=$?
          cat /tmp/tfplan.out
          if [ "${rc}" -ne 0 ]; then
            if grep -qE 'AccessDenied|UnauthorizedOperation|ExpiredToken|AccessDeniedException' /tmp/tfplan.out; then
              {
                echo "### Terraform plan failed — AWS auth"
                echo ""
                echo "OIDC assume-role or IAM policy denied an API. Check AWS_ROLE_TO_ASSUME and the runner policy."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Paid plan failed AWS auth. Check AWS_ROLE_TO_ASSUME / OIDC trust (aws-infra-paid.yml)."
              exit 1
            fi
            {
              echo "### Terraform plan failed"
              echo ""
              echo '```'
              grep -E '^Error:|  on |AccessDenied|UnauthorizedOperation|ExpiredToken' /tmp/tfplan.out | head -n 40 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::terraform plan failed. See job summary and the Error: lines above."
            exit 1
          fi
          set -euo pipefail
          {
            echo "### Terraform plan"
            echo ""
            echo "Profile: \`actual\`"
            echo "Backend: \`s3://${BUCKET}/estate/terraform.tfstate\`"
            echo "Action: \`${{ inputs.action }}\`"
            echo "- instance profiles: \`hr-paid-{portal,rest,haystack,neo4j}\`"
            echo "- observability: CloudTrail \`heavy-rental-actual\`, dashboard \`heavy-rental-actual\`, observe S3"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: terraform apply
        if: inputs.action == 'apply'
        working-directory: terraform/academy
        run: |
          set -euo pipefail
          set +e
          terraform apply -input=false -auto-approve -no-color tfplan > /tmp/tfapply.out 2>&1
          rc=$?
          cat /tmp/tfapply.out
          if [ "${rc}" -ne 0 ]; then
            if grep -qE 'AccessDenied|UnauthorizedOperation|ExpiredToken|AccessDeniedException' /tmp/tfapply.out; then
              {
                echo "### Terraform apply failed — AWS auth"
                echo ""
                echo "OIDC assume-role or IAM policy denied persist. Re-run apply after fixing AWS_ROLE_TO_ASSUME."
                echo "The next run imports leftovers into state (or \`destroy\` if two estate VPCs exist)."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Paid apply failed AWS auth after resources may have been created. Fix OIDC/IAM and re-run apply."
              exit 1
            fi
            if grep -qE 'AlreadyExists|RepositoryAlreadyExistsException|ResourceExistsException|DBSubnetGroupAlreadyExists|DBInstanceAlreadyExists|DuplicateLoadBalancerName|InvalidGroup.Duplicate' /tmp/tfapply.out; then
              {
                echo "### Terraform apply failed — named AWS object already exists"
                echo ""
                echo "Reconcile did not bind every leftover into state, or two estate VPCs exist."
                echo "1. If the job reported two \`heavy-rental-academy\` VPCs: \`action=destroy\` then \`apply\`."
                echo "2. Otherwise re-run \`action=plan\` (reconcile runs again) then \`apply\`."
                echo ""
                echo '```'
                grep -E '^Error:|  on |AlreadyExists|RepositoryAlreadyExists|ResourceExists|DBSubnetGroupAlreadyExists|DBInstanceAlreadyExists' /tmp/tfapply.out | head -n 40 || true
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Named AWS objects already exist and are not fully in state. Re-run plan/apply, or destroy if two estate VPCs exist."
              exit 1
            fi
            {
              echo "### Terraform apply failed"
              echo ""
              echo '```'
              grep -E '^Error:|  on |AccessDenied|UnauthorizedOperation|ExpiredToken|errored.tfstate' /tmp/tfapply.out | head -n 40 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::terraform apply failed. See job summary."
            exit 1
          fi
          set -euo pipefail
          {
            echo "### Terraform apply"
            echo ""
            echo "- profile: \`$(terraform output -raw deployment)\`"
            echo "- portal ALB: \`$(terraform output -raw portal_alb_dns)\`"
            echo "- REST ALB (public :8080): \`$(terraform output -raw rest_alb_dns)\`"
            echo "- Haystack ALB (internal): \`$(terraform output -raw haystack_alb_dns)\`"
            echo "- RDS SoR (\`heavy_rental\`): \`$(terraform output -raw rds_endpoint)\`"
            echo "- RDS Haystack (\`haystack\`): \`$(terraform output -raw rds_haystack_endpoint)\`"
            echo "- Neo4j Bolt NLB: \`$(terraform output -raw neo4j_uri)\`"
            echo "- NAT Gateways: \`$(terraform output -json nat_gateway_ids)\`"
            echo "- instance profiles: Terraform \`hr-paid-{portal,rest,haystack,neo4j}\`"
            echo "- Ansible SSM bucket: \`$(terraform output -raw ansible_ssm_bucket)\`"
            echo "- CloudTrail: \`$(terraform output -raw cloudtrail_name)\` (S3 only)"
            echo "- observe bucket: \`$(terraform output -raw observe_bucket)\`"
            echo "- CloudWatch dashboard: \`$(terraform output -raw cloudwatch_dashboard)\`"
            echo "- SNS alarms: \`$(terraform output -raw sns_alarm_topic)\`"
            echo ""
            echo "Confirm the SNS email if Environment \`ALARM_EMAIL\` is set."
            echo "Configure jobs (\`sync-secrets\` / SSH / Ansible) run next on apply."
            echo "Session end does **not** stop RDS, ALB, NAT Gateway, CloudTrail, or observe-bucket billing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify observability
        if: inputs.action == 'apply'
        working-directory: terraform/academy
        run: |
          set -euo pipefail
          TRAIL="$(terraform output -raw cloudtrail_name)"
          DASH="$(terraform output -raw cloudwatch_dashboard)"
          BUCKET="$(terraform output -raw observe_bucket)"
          aws cloudtrail get-trail --name "${TRAIL}" >/dev/null
          aws cloudwatch get-dashboard --dashboard-name "${DASH}" >/dev/null
          aws s3api head-bucket --bucket "${BUCKET}"
          ALARM_N="$(aws cloudwatch describe-alarms \
            --alarm-name-prefix hr- \
            --query 'length(MetricAlarms)' --output text)"
          if [ "${ALARM_N}" = "0" ]; then
            echo "::error::No CloudWatch alarms with prefix hr- after apply."
            exit 1
          fi
          {
            echo "### Observability verify"
            echo ""
            echo "Trail \`${TRAIL}\`, dashboard \`${DASH}\`, bucket \`${BUCKET}\`, alarms \`${ALARM_N}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  destroy:
    name: Destroy estate
    needs: [assert-lab]
    if: needs.assert-lab.result == 'success' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: AWS_ACTUAL
    timeout-minutes: 90
    steps:
      - name: Require confirm_destroy
        env:
          CONFIRM_IN: ${{ inputs.confirm_destroy }}
        run: |
          set -euo pipefail
          CONFIRM="$(printf '%s' "${CONFIRM_IN}" | tr -d '[:space:]')"
          if [ -z "${CONFIRM}" ]; then
            CONFIRM="$(jq -r '.inputs.confirm_destroy // empty' "$GITHUB_EVENT_PATH" | tr -d '[:space:]')"
          fi
          if [ "${CONFIRM}" != "destroy" ]; then
            echo "::error::Pick confirm_destroy=destroy on the Run form (got '${CONFIRM:-empty}'). Choosing action=destroy is not enough. State bucket is kept."
            exit 1
          fi

      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/resolve-aws-profile
        with:
          profile: AWS_ACTUAL
          aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
          aws_role_to_assume: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: RDS password for destroy refresh
        env:
          DB_PASS: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
        run: |
          set +x
          PLACEHOLDER="${DB_PASSWORD_PLAN_PLACEHOLDER}"
          if [ -n "${DB_PASS}" ] && [ "${DB_PASS}" != "${PLACEHOLDER}" ] && [ "${#DB_PASS}" -ge 8 ]; then
            PASS="${DB_PASS}"
          else
            PASS="${PLACEHOLDER}"
          fi
          echo "::add-mask::${PASS}"
          echo "TF_VAR_db_master_password=${PASS}" >> "$GITHUB_ENV"
          echo "TF_VAR_alarm_email=${{ vars.ALARM_EMAIL }}" >> "$GITHUB_ENV"

      - name: terraform init
        env:
          BUCKET: ${{ needs.assert-lab.outputs.bucket }}
        working-directory: terraform/academy
        run: |
          set -euo pipefail
          if ! aws s3api head-bucket --bucket "${BUCKET}" 2>/dev/null; then
            echo "::error::State bucket ${BUCKET} is missing. Nothing to destroy. Do not create a backend on action=destroy."
            exit 1
          fi
          chmod +x ../../scripts/estate-unlock.sh ../../scripts/reconcile-estate.sh ../../scripts/sweep-estate-orphans.sh
          ../../scripts/estate-unlock.sh "${BUCKET}"
          if ! terraform init -input=false -reconfigure \
            -backend-config="bucket=${BUCKET}" \
            -backend-config="key=estate/terraform.tfstate" \
            -backend-config="region=${AWS_DEFAULT_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"; then
            echo "::error::terraform init failed. Check S3 bucket ${BUCKET}."
            exit 1
          fi

      - name: Reconcile leftovers into state
        env:
          ESTATE_ON_VPC_FORK: continue
          ESTATE_IMPORT_STRICT: "false"
        working-directory: terraform/academy
        run: |
          set -euo pipefail
          chmod +x ../../scripts/reconcile-estate.sh
          ../../scripts/reconcile-estate.sh

      - name: Terminate estate EC2 so primary ENIs can be deleted
        run: |
          set -euo pipefail
          for asg in asg-portal asg-rest asg-haystack asg-neo4j; do
            aws autoscaling update-auto-scaling-group \
              --auto-scaling-group-name "${asg}" \
              --min-size 0 --desired-capacity 0 --max-size 0 \
              || echo "ASG ${asg} missing or already gone."
          done
          mapfile -t IDS < <(aws ec2 describe-instances \
            --filters \
              Name=tag:Stack,Values=estate \
              Name=instance-state-name,Values=pending,running,stopping,stopped \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text | tr '\t' '\n' | awk 'NF')
          if [ "${#IDS[@]}" -eq 0 ]; then
            echo "No estate EC2 left to terminate."
            exit 0
          fi
          echo "Terminating ${#IDS[@]} estate instance(s) so eth0 is released: ${IDS[*]}"
          aws ec2 terminate-instances --instance-ids "${IDS[@]}"
          aws ec2 wait instance-terminated --instance-ids "${IDS[@]}"
          echo "Estate EC2 terminated."

      - name: terraform destroy
        working-directory: terraform/academy
        run: |
          set -euo pipefail
          set +e
          terraform destroy -input=false -auto-approve -no-color > /tmp/tfdestroy.out 2>&1
          rc=$?
          cat /tmp/tfdestroy.out
          if grep -qE 'AccessDenied|UnauthorizedOperation|ExpiredToken|AccessDeniedException' /tmp/tfdestroy.out; then
            {
              echo "### Terraform destroy failed — AWS auth"
              echo ""
              echo "OIDC assume-role or IAM policy denied destroy. Do not assume the estate is gone. Re-run destroy."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Paid destroy failed AWS auth. Re-run destroy. Do not assume resources were deleted."
            exit 1
          fi
          if [ "${rc}" -ne 0 ] && grep -q 'device index 0' /tmp/tfdestroy.out; then
            echo "Destroy hit a primary ENI. Dropping leftover ENI addresses from state and retrying."
            while read -r addr; do
              [ -n "${addr}" ] || continue
              terraform state rm "${addr}" || true
            done < <(terraform state list | grep -E 'aws_network_interface|aws_network_interface_attachment' || true)
            terraform destroy -input=false -auto-approve -no-color
            rc=$?
          fi
          chmod +x ../../scripts/sweep-estate-orphans.sh
          echo "Sweeping leftovers that were never in state (or survived destroy)."
          ../../scripts/sweep-estate-orphans.sh
          sweep_rc=$?
          set -euo pipefail
          if [ "${rc}" -eq 0 ] && [ "${sweep_rc}" -eq 0 ]; then
            {
              echo "### Terraform destroy"
              echo ""
              echo "Estate state emptied. Named leftovers (ASGs, extra VPCs, RDS, secrets) swept."
              echo "S3 backend bucket **kept**."
              echo "Re-run \`action=apply\` to recreate (8 EC2, two NAT Gateways, two Multi-AZ RDS, Bolt NLB)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Terraform destroy failed"
            echo ""
            echo '```'
            grep -E '^Error:|  on |AccessDenied|UnauthorizedOperation|device index|ExpiredToken' /tmp/tfdestroy.out | head -n 40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::terraform destroy or leftover sweep failed. See job summary."
          exit 1

  sync-secrets:
    name: Sync GitHub secrets to AWS Secrets Manager
    needs: [assert-lab, terraform]
    if: always() && needs.assert-lab.result == 'success' && (inputs.action == 'apply' || inputs.action == 'configure-only' || inputs.action == 'deploy-projects') && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    runs-on: ubuntu-latest
    environment: AWS_ACTUAL
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/resolve-aws-profile
        with:
          profile: AWS_ACTUAL
          aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
          aws_role_to_assume: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Init estate state and put-secret-value
        env:
          BUCKET: ${{ needs.assert-lab.outputs.bucket }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
          ONEMAP_EMAIL: ${{ secrets.ONEMAP_EMAIL }}
          ONEMAP_PASSWORD: ${{ secrets.ONEMAP_PASSWORD }}
          DYNAMIC_PRICING_ENABLED: ${{ vars.DYNAMIC_PRICING_ENABLED }}
          PRICING_DEFAULT_DISTANCE_KM: ${{ vars.PRICING_DEFAULT_DISTANCE_KM }}
          PRICING_ORIGIN_POSTAL_CODE: ${{ vars.PRICING_ORIGIN_POSTAL_CODE }}
          PRICING_DISTANCE_LOOKUP_ENABLED: ${{ vars.PRICING_DISTANCE_LOOKUP_ENABLED }}
          TF_VAR_db_master_password: ${{ secrets.SPRING_DATASOURCE_PASSWORD || 'PlanOnlyNotApplied1!' }}
        run: |
          set +x
          chmod +x scripts/estate-tf-init.sh scripts/sync-secrets.sh
          scripts/estate-tf-init.sh "${BUCKET}"
          scripts/sync-secrets.sh
          {
            echo "### sync-secrets"
            echo ""
            echo "Wrote \`heavy-rental/{portal,rest,haystack,neo4j}\`. SecretString not printed."
            echo "No AWS access keys were written."
          } >> "$GITHUB_STEP_SUMMARY"

  sync-ssh-keys:
    name: SSH PEMs after EC2 InService
    needs: [assert-lab, terraform]
    if: always() && needs.assert-lab.result == 'success' && (inputs.action == 'apply' || inputs.action == 'configure-only' || inputs.action == 'deploy-projects') && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    runs-on: ubuntu-latest
    environment: AWS_ACTUAL
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/resolve-aws-profile
        with:
          profile: AWS_ACTUAL
          aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
          aws_role_to_assume: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}

      - name: Wait InService and install public keys
        run: |
          set +x
          chmod +x scripts/sync-ssh-keys.sh
          scripts/sync-ssh-keys.sh
          {
            echo "### sync-ssh-keys"
            echo ""
            echo "PEMs in \`heavy-rental/ssh/*\`. Public keys via SSM. PEM not printed or left on guests."
          } >> "$GITHUB_STEP_SUMMARY"

  ansible:
    name: Ansible compose (SSM)
    needs: [assert-lab, terraform, sync-secrets, sync-ssh-keys]
    if: always() && needs.assert-lab.result == 'success' && needs.sync-secrets.result == 'success' && needs.sync-ssh-keys.result == 'success' && (inputs.action == 'apply' || inputs.action == 'configure-only') && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    runs-on: ubuntu-latest
    environment: AWS_ACTUAL
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/resolve-aws-profile
        with:
          profile: AWS_ACTUAL
          aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
          aws_role_to_assume: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}

      - name: Session Manager plugin
        run: |
          set -euo pipefail
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/ssm.deb
          sudo dpkg -i /tmp/ssm.deb

      - name: Install Ansible 14.3.1
        run: |
          set -euo pipefail
          python3 -m pip install --user "ansible==14.3.1" "boto3>=1.35.0" "botocore>=1.35.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: ansible-playbook
        env:
          ACTION: ${{ inputs.action }}
          IMAGE_REF: ${{ inputs.image_ref }}
          IMAGE_HTTP_INPUT: ${{ inputs.image_http_url }}
          IMAGE_HTTP_URL: ${{ inputs.image_http_url || vars.IMAGE_HTTP_URL }}
          PORTAL_IMAGE: ${{ vars.PORTAL_IMAGE }}
          REST_IMAGE: ${{ vars.REST_IMAGE }}
          HAYSTACK_IMAGE: ${{ vars.HAYSTACK_IMAGE }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          BUCKET: ${{ needs.assert-lab.outputs.bucket }}
          SSM_BUCKET: ${{ needs.assert-lab.outputs.ssm_bucket }}
        working-directory: ansible
        run: |
          set -euo pipefail
          chmod +x inventory/aws_ssm.py
          ANSIBLE_S3="${SSM_BUCKET}" 
          # apply and configure-only: same playbook. Docker + Compose on all
          # guests; Neo4j compose only. Do not pull portal/REST/Haystack images
          # (private GHCR fails without a token). App compose is app CD.
          ansible-playbook playbooks/configure.yml \
            -e "neo4j_image=neo4j:5" \
            -e "image_http_url=" \
            -e "aws_region=${AWS_REGION}" \
            -e "ansible_aws_ssm_bucket_name=${ANSIBLE_S3}"
          {
            echo "### Ansible"
            echo ""
            echo "\`apply\` / \`configure-only\`: Docker + Compose plugin on all guests; Neo4j compose only (\`configure.yml\`). Portal / REST / Haystack images are app CD. \`site.yml\` is not invoked."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-projects:
    name: Deploy projects (site.yml)
    needs: [assert-lab, sync-secrets, sync-ssh-keys]
    if: always() && needs.assert-lab.result == 'success' && needs.sync-secrets.result == 'success' && needs.sync-ssh-keys.result == 'success' && inputs.action == 'deploy-projects'
    runs-on: ubuntu-latest
    environment: AWS_ACTUAL
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/resolve-aws-profile
        with:
          profile: AWS_ACTUAL
          aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
          aws_role_to_assume: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}

      - name: Resolve images and require estate
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
          IMAGE_HTTP_INPUT: ${{ inputs.image_http_url }}
          IMAGE_HTTP_URL: ${{ inputs.image_http_url || vars.IMAGE_HTTP_URL }}
          PORTAL_IMAGE: ${{ vars.PORTAL_IMAGE }}
          REST_IMAGE: ${{ vars.REST_IMAGE }}
          HAYSTACK_IMAGE: ${{ vars.HAYSTACK_IMAGE }}
        run: |
          set -euo pipefail
          if [ -n "${IMAGE_HTTP_INPUT:-}" ] || [ -n "${IMAGE_HTTP_URL:-}" ]; then
            echo "::error::action=deploy-projects does not accept image_http_url / IMAGE_HTTP_URL. One tar cannot satisfy portal + REST + Haystack. Use public GHCR or ECR tags."
            exit 1
          fi
          PORTAL="${PORTAL_IMAGE:-}"
          REST="${REST_IMAGE:-}"
          HAY="${HAYSTACK_IMAGE:-}"
          if [ -z "${REST}" ]; then REST="${IMAGE_REF:-}"; fi
          if [ -z "${HAY}" ]; then HAY="${IMAGE_REF:-}"; fi
          if [ -z "${PORTAL}" ] || [ "${PORTAL}" = "nginx" ]; then
            echo "::error::action=deploy-projects needs Environment PORTAL_IMAGE (public GHCR or ECR). Stock nginx is forbidden."
            exit 1
          fi
          if [ -z "${REST}" ]; then
            echo "::error::action=deploy-projects needs Environment REST_IMAGE or Run image_ref. There is no stock Tomcat."
            exit 1
          fi
          if [ -z "${HAY}" ]; then
            echo "::error::action=deploy-projects needs Environment HAYSTACK_IMAGE or Run image_ref. There is no stock uvicorn."
            exit 1
          fi
          check_ghcr() {
            local tag="$1"
            [[ "${tag}" == ghcr.io/* ]] || return 0
            local owner_repo_tag="${tag#ghcr.io/}"
            local repo="${owner_repo_tag%:*}"
            local ref="${owner_repo_tag##*:}"
            if [ "${ref}" = "${owner_repo_tag}" ]; then
              ref=latest
            fi
            local token code
            token="$(curl -fsSL "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull" | jq -r '.token // empty' || true)"
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${repo}/manifests/${ref}" || echo 000)"
            if [ "${code}" = "401" ] || [ "${code}" = "403" ]; then
              echo "::error::${tag} is not pullable without a token (private GHCR). Copy to ECR. Do not put a PAT on the guest."
              exit 1
            fi
            if [ "${code}" != "200" ]; then
              echo "::error::Cannot read ${tag} from GHCR (HTTP ${code}). Use a public tag or ECR."
              exit 1
            fi
          }
          check_ghcr "${PORTAL}"
          check_ghcr "${REST}"
          check_ghcr "${HAY}"
          for asg in asg-portal asg-rest asg-haystack asg-neo4j; do
            name="$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "${asg}" \
              --query 'AutoScalingGroups[0].AutoScalingGroupName' \
              --output text 2>/dev/null || true)"
            if [ -z "${name}" ] || [ "${name}" = "None" ]; then
              echo "::error::${asg} is missing. Run action=apply (then this action) first."
              exit 1
            fi
          done
          {
            echo "PORTAL_IMAGE=${PORTAL}"
            echo "REST_IMAGE=${REST}"
            echo "HAYSTACK_IMAGE=${HAY}"
          } >> "$GITHUB_ENV"
          {
            echo "### Resolve images"
            echo ""
            echo "portal: \`${PORTAL}\`"
            echo "rest: \`${REST}\`"
            echo "haystack: \`${HAY}\`"
            echo ""
            echo "Estate ASGs present. This run is after apply / configure-only; it is not chained onto those actions."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Session Manager plugin
        run: |
          set -euo pipefail
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/ssm.deb
          sudo dpkg -i /tmp/ssm.deb

      - name: Install Ansible 14.3.1
        run: |
          set -euo pipefail
          python3 -m pip install --user "ansible==14.3.1" "boto3>=1.35.0" "botocore>=1.35.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: ansible-playbook site.yml
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
          PORTAL_IMAGE: ${{ env.PORTAL_IMAGE }}
          REST_IMAGE: ${{ env.REST_IMAGE }}
          HAYSTACK_IMAGE: ${{ env.HAYSTACK_IMAGE }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          BUCKET: ${{ needs.assert-lab.outputs.bucket }}
          SSM_BUCKET: ${{ needs.assert-lab.outputs.ssm_bucket }}
        working-directory: ansible
        run: |
          set -euo pipefail
          chmod +x inventory/aws_ssm.py
          ANSIBLE_S3="${SSM_BUCKET}" 
          ansible-playbook playbooks/site.yml \
            -e "neo4j_image=neo4j:5" \
            -e "image_http_url=" \
            -e "aws_region=${AWS_REGION}" \
            -e "ansible_aws_ssm_bucket_name=${ANSIBLE_S3}"
          {
            echo "### Ansible site.yml"
            echo ""
            echo "\`deploy-projects\`: composed portal + REST + Haystack + Neo4j and ran \`rds_logical\`. Not Terraform. Prefer app CD for a later single-image roll."
          } >> "$GITHUB_STEP_SUMMARY"

  stop:
    name: Stop lab resources
    needs: [assert-lab]
    if: needs.assert-lab.result == 'success' && inputs.action == 'stop'
    runs-on: ubuntu-latest
    environment: AWS_ACTUAL
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/resolve-aws-profile
        with:
          profile: AWS_ACTUAL
          aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
          aws_role_to_assume: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}

      - name: Pause ASGs and both RDS
        run: |
          set -euo pipefail
          chmod +x scripts/stop-estate.sh
          scripts/stop-estate.sh
          {
            echo "### stop (pause)"
            echo ""
            echo "ASGs desired=0. Both RDS stop requested. **NAT Gateways, ALBs, NLB still bill.** This is not destroy."
          } >> "$GITHUB_STEP_SUMMARY"
