# AWS Academy (Vocareum) infrastructure — branch 2 estate.
# Not paid. Not OIDC. Not app CI. Not Ansible / sync-secrets.
#
# Operator:
#   1. Start Lab → AWS Details
#   2. Paste the three Vocareum keys on the Run form, or leave empty and use
#      Environment academy AWS_* secrets
#   3. Environment academy secret SPRING_DATASOURCE_PASSWORD (required for apply)
#   4. action=plan | action=apply | action=destroy (confirm_destroy=destroy)
#
# Do not point aws_environment at paid. Do not write keys to Secrets Manager.
# Form keys are read from $GITHUB_EVENT_PATH (not env: / ${{ inputs.* }}) so
# job logs can mask them. The run Inputs page may still show the strings.

name: AWS infrastructure (Academy)

on:
  workflow_dispatch:
    inputs:
      action:
        description: plan, apply, or destroy the estate. configure/stop wait for branch 3.
        required: true
        type: choice
        default: plan
        options:
          - plan
          - bootstrap
          - apply
          - configure-only
          - stop
          - destroy
      aws_environment:
        description: Must be academy (Vocareum Learner Lab)
        required: true
        type: environment
        default: academy
      confirm_destroy:
        description: For action=destroy, pick destroy here too. action=destroy alone is not enough. Leaves the state bucket.
        required: true
        type: choice
        default: "no"
        options:
          - "no"
          - destroy
      aws_access_key_id:
        description: Vocareum AWS Details access key (changes every Start Lab). Empty = Environment academy.
        required: false
        type: string
        default: ""
      aws_secret_access_key:
        description: Vocareum secret access key. Empty = Environment academy.
        required: false
        type: string
        default: ""
      aws_session_token:
        description: Vocareum session token. Empty = Environment academy.
        required: false
        type: string
        default: ""

concurrency:
  group: aws-infra-academy-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_DEFAULT_REGION: us-east-1
  DB_PASSWORD_PLAN_PLACEHOLDER: "PlanOnlyNotApplied1!"

jobs:
  assert-lab:
    name: Assert Vocareum session
    runs-on: ubuntu-latest
    environment: ${{ inputs.aws_environment }}
    timeout-minutes: 5
    outputs:
      account_id: ${{ steps.sts.outputs.account_id }}
      bucket: ${{ steps.sts.outputs.bucket }}
    steps:
      - name: Refuse paid Environment
        env:
          ENV_NAME: ${{ inputs.aws_environment }}
        run: |
          set -euo pipefail
          if [ "${ENV_NAME}" != "academy" ]; then
            echo "::error::This workflow is AWS Academy / Vocareum only. Use Environment academy (got '${ENV_NAME}')."
            exit 1
          fi

      - name: Resolve Vocareum credentials
        env:
          ENV_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          ENV_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ENV_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set +x
          KEY="$(jq -r '.inputs.aws_access_key_id // empty' "$GITHUB_EVENT_PATH")"
          SECRET="$(jq -r '.inputs.aws_secret_access_key // empty' "$GITHUB_EVENT_PATH")"
          TOKEN="$(jq -r '.inputs.aws_session_token // empty' "$GITHUB_EVENT_PATH")"
          [ -n "${KEY}" ] && echo "::add-mask::${KEY}"
          [ -n "${SECRET}" ] && echo "::add-mask::${SECRET}"
          [ -n "${TOKEN}" ] && echo "::add-mask::${TOKEN}"
          if [ -z "${KEY}" ] || [ -z "${SECRET}" ] || [ -z "${TOKEN}" ]; then
            KEY="${ENV_KEY}"
            SECRET="${ENV_SECRET}"
            TOKEN="${ENV_TOKEN}"
          fi
          if [ -z "${KEY}" ] || [ -z "${SECRET}" ] || [ -z "${TOKEN}" ]; then
            echo "::error::Start Lab. Paste AWS Details on the form or set Environment academy secrets."
            exit 1
          fi
          echo "::add-mask::${KEY}"
          echo "::add-mask::${SECRET}"
          echo "::add-mask::${TOKEN}"
          {
            echo "AWS_ACCESS_KEY_ID=${KEY}"
            echo "AWS_SECRET_ACCESS_KEY=${SECRET}"
            echo "AWS_SESSION_TOKEN=${TOKEN}"
          } >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Prove the Vocareum session is live
        id: sts
        run: |
          set -euo pipefail
          if ! ARN=$(aws sts get-caller-identity --query Arn --output text); then
            echo "::error::sts failed. Start Lab and paste a fresh session token (or refresh Environment academy AWS_* secrets)."
            exit 1
          fi
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=${ACCOUNT}" >> "$GITHUB_OUTPUT"
          echo "bucket=heavy-rental-tfstate-${ACCOUNT}-academy" >> "$GITHUB_OUTPUT"
          {
            echo "### Vocareum / Academy"
            echo ""
            echo "Caller: \`${ARN}\`"
            echo "Account: \`${ACCOUNT}\`"
            echo "Action: \`${{ inputs.action }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  ensure-backend:
    name: Ensure S3 + DynamoDB state backend
    needs: [assert-lab]
    if: inputs.action == 'plan' || inputs.action == 'bootstrap' || inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: ${{ inputs.aws_environment }}
    timeout-minutes: 15
    steps:
      - name: Resolve Vocareum credentials
        env:
          ENV_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          ENV_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ENV_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set +x
          KEY="$(jq -r '.inputs.aws_access_key_id // empty' "$GITHUB_EVENT_PATH")"
          SECRET="$(jq -r '.inputs.aws_secret_access_key // empty' "$GITHUB_EVENT_PATH")"
          TOKEN="$(jq -r '.inputs.aws_session_token // empty' "$GITHUB_EVENT_PATH")"
          [ -n "${KEY}" ] && echo "::add-mask::${KEY}"
          [ -n "${SECRET}" ] && echo "::add-mask::${SECRET}"
          [ -n "${TOKEN}" ] && echo "::add-mask::${TOKEN}"
          if [ -z "${KEY}" ] || [ -z "${SECRET}" ] || [ -z "${TOKEN}" ]; then
            KEY="${ENV_KEY}"
            SECRET="${ENV_SECRET}"
            TOKEN="${ENV_TOKEN}"
          fi
          if [ -z "${KEY}" ] || [ -z "${SECRET}" ] || [ -z "${TOKEN}" ]; then
            echo "::error::Start Lab. Paste AWS Details on the form or set Environment academy secrets."
            exit 1
          fi
          echo "::add-mask::${KEY}"
          echo "::add-mask::${SECRET}"
          echo "::add-mask::${TOKEN}"
          {
            echo "AWS_ACCESS_KEY_ID=${KEY}"
            echo "AWS_SECRET_ACCESS_KEY=${SECRET}"
            echo "AWS_SESSION_TOKEN=${TOKEN}"
          } >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: actions/checkout@v7.0.1

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Create backend if missing
        env:
          BUCKET: ${{ needs.assert-lab.outputs.bucket }}
        working-directory: terraform/backend
        run: |
          set -euo pipefail
          if aws s3api head-bucket --bucket "${BUCKET}" 2>/dev/null; then
            echo "State bucket ${BUCKET} already exists (S3 native lockfile; no DynamoDB)."
            exit 0
          fi
          echo "Creating Vocareum Academy state backend (bucket=${BUCKET})."
          terraform init -input=false
          terraform apply -auto-approve -input=false
          if [ -f terraform.tfstate ]; then
            aws s3 cp terraform.tfstate "s3://${BUCKET}/backend/terraform.tfstate"
          fi

  terraform:
    name: Terraform estate (Academy)
    needs: [assert-lab, ensure-backend]
    if: always() && needs.assert-lab.result == 'success' && needs.ensure-backend.result == 'success' && (inputs.action == 'plan' || inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment: ${{ inputs.aws_environment }}
    timeout-minutes: 30
    steps:
      - name: Resolve Vocareum credentials
        env:
          ENV_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          ENV_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ENV_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set +x
          KEY="$(jq -r '.inputs.aws_access_key_id // empty' "$GITHUB_EVENT_PATH")"
          SECRET="$(jq -r '.inputs.aws_secret_access_key // empty' "$GITHUB_EVENT_PATH")"
          TOKEN="$(jq -r '.inputs.aws_session_token // empty' "$GITHUB_EVENT_PATH")"
          [ -n "${KEY}" ] && echo "::add-mask::${KEY}"
          [ -n "${SECRET}" ] && echo "::add-mask::${SECRET}"
          [ -n "${TOKEN}" ] && echo "::add-mask::${TOKEN}"
          if [ -z "${KEY}" ] || [ -z "${SECRET}" ] || [ -z "${TOKEN}" ]; then
            KEY="${ENV_KEY}"
            SECRET="${ENV_SECRET}"
            TOKEN="${ENV_TOKEN}"
          fi
          if [ -z "${KEY}" ] || [ -z "${SECRET}" ] || [ -z "${TOKEN}" ]; then
            echo "::error::Start Lab. Paste AWS Details on the form or set Environment academy secrets."
            exit 1
          fi
          echo "::add-mask::${KEY}"
          echo "::add-mask::${SECRET}"
          echo "::add-mask::${TOKEN}"
          {
            echo "AWS_ACCESS_KEY_ID=${KEY}"
            echo "AWS_SECRET_ACCESS_KEY=${SECRET}"
            echo "AWS_SESSION_TOKEN=${TOKEN}"
          } >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: actions/checkout@v7.0.1

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Resolve RDS master password
        env:
          DB_PASS: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          ACTION: ${{ inputs.action }}
        run: |
          set +x
          PLACEHOLDER="${DB_PASSWORD_PLAN_PLACEHOLDER}"
          if [ "${ACTION}" = "apply" ]; then
            if [ -z "${DB_PASS}" ] || [ "${DB_PASS}" = "${PLACEHOLDER}" ] || [ "${#DB_PASS}" -lt 8 ]; then
              echo "::error::Set Environment academy secret SPRING_DATASOURCE_PASSWORD (>= 8 chars) before action=apply. Do not put it on the Run form."
              exit 1
            fi
            PASS="${DB_PASS}"
          else
            # Plan must not fail validation if the secret is unset or shorter than 8.
            if [ -n "${DB_PASS}" ] && [ "${DB_PASS}" != "${PLACEHOLDER}" ] && [ "${#DB_PASS}" -ge 8 ]; then
              PASS="${DB_PASS}"
            else
              PASS="${PLACEHOLDER}"
            fi
          fi
          echo "::add-mask::${PASS}"
          echo "TF_VAR_db_master_password=${PASS}" >> "$GITHUB_ENV"

      - name: Preflight Vocareum data sources
        run: |
          set -euo pipefail
          if ! aws iam get-instance-profile --instance-profile-name LabInstanceProfile >/dev/null; then
            echo "::error::IAM instance profile LabInstanceProfile was not found. Vocareum must expose this name for every ASG."
            exit 1
          fi
          if ! aws iam get-role --role-name LabRole >/dev/null; then
            echo "::error::IAM role LabRole was not found. Vocareum must pre-create LabRole."
            exit 1
          fi
          PROFILE_ROLE="$(aws iam get-instance-profile \
            --instance-profile-name LabInstanceProfile \
            --query 'InstanceProfile.Roles[0].RoleName' \
            --output text)"
          if [ "${PROFILE_ROLE}" != "LabRole" ]; then
            echo "::error::LabInstanceProfile must use LabRole (got '${PROFILE_ROLE}'). Do not create IAM."
            exit 1
          fi
          echo "LabInstanceProfile uses LabRole."
          echo "Available Postgres engine versions (first 8):"
          aws rds describe-db-engine-versions \
            --engine postgres \
            --query 'DBEngineVersions[0:8].EngineVersion' \
            --output text
          echo "Latest Amazon Linux 2023 x86_64 AMI (DescribeImages):"
          aws ec2 describe-images \
            --owners amazon \
            --filters \
              Name=name,Values=al2023-ami-*-kernel-*-x86_64 \
              Name=state,Values=available \
              Name=architecture,Values=x86_64 \
            --query 'sort_by(Images,&CreationDate)[-1].[ImageId,Name]' \
            --output text

      - name: terraform init
        env:
          BUCKET: ${{ needs.assert-lab.outputs.bucket }}
        working-directory: terraform/academy
        run: |
          set -euo pipefail
          if ! terraform init -input=false -reconfigure \
            -backend-config="bucket=${BUCKET}" \
            -backend-config="key=estate/terraform.tfstate" \
            -backend-config="region=${AWS_DEFAULT_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"; then
            echo "::error::terraform init failed. Check S3 bucket ${BUCKET} (S3 native lockfile)."
            exit 1
          fi

      - name: terraform plan
        env:
          BUCKET: ${{ needs.assert-lab.outputs.bucket }}
        working-directory: terraform/academy
        run: |
          set -euo pipefail
          set +e
          terraform plan -input=false -no-color -out=tfplan > /tmp/tfplan.out 2>&1
          rc=$?
          cat /tmp/tfplan.out
          if [ "${rc}" -ne 0 ]; then
            {
              echo "### Terraform plan failed"
              echo ""
              echo '```'
              grep -E '^Error:|  on |AccessDenied|UnauthorizedOperation' /tmp/tfplan.out | head -n 40 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::terraform plan failed. See job summary and the Error: lines above."
            exit 1
          fi
          set -euo pipefail
          {
            echo "### Terraform plan (Academy estate)"
            echo ""
            echo "Backend: \`s3://${BUCKET}/estate/terraform.tfstate\`"
            echo "Action: \`${{ inputs.action }}\`"
            echo "- instance profile: \`LabInstanceProfile\`"
            echo "- IAM role: \`LabRole\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: terraform apply
        if: inputs.action == 'apply'
        working-directory: terraform/academy
        run: |
          set -euo pipefail
          terraform apply -input=false -auto-approve tfplan
          {
            echo "### Terraform apply"
            echo ""
            echo "- portal ALB: \`$(terraform output -raw portal_alb_dns)\`"
            echo "- REST ALB (internal): \`$(terraform output -raw rest_alb_dns)\`"
            echo "- Haystack ALB (internal): \`$(terraform output -raw haystack_alb_dns)\`"
            echo "- RDS SoR (\`heavy_rental\`): \`$(terraform output -raw rds_endpoint)\`"
            echo "- RDS Haystack (\`haystack\`): \`$(terraform output -raw rds_haystack_endpoint)\`"
            echo "- Neo4j Bolt NLB: \`$(terraform output -raw neo4j_uri)\`"
            echo "- instance profile: \`$(terraform output -raw lab_instance_profile)\`"
            echo "- IAM role: \`$(terraform output -raw lab_role)\`"
            echo ""
            echo "Guests have **no containers** yet. Public portal ALB may 502 until branch 3."
            echo "Session end does **not** stop RDS or ALB billing."
          } >> "$GITHUB_STEP_SUMMARY"

  destroy:
    name: Destroy Academy estate
    needs: [assert-lab]
    if: needs.assert-lab.result == 'success' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: ${{ inputs.aws_environment }}
    timeout-minutes: 60
    steps:
      - name: Require confirm_destroy
        run: |
          set -euo pipefail
          CONFIRM="$(jq -r '.inputs.confirm_destroy // empty' "$GITHUB_EVENT_PATH" | tr -d '[:space:]')"
          if [ -z "${CONFIRM}" ]; then
            CONFIRM="$(echo '${{ inputs.confirm_destroy }}' | tr -d '[:space:]')"
          fi
          if [ "${CONFIRM}" != "destroy" ]; then
            echo "::error::Pick confirm_destroy=destroy on the Run form (got '${CONFIRM:-empty}'). Choosing action=destroy is not enough. State bucket is kept."
            exit 1
          fi

      - name: Resolve Vocareum credentials
        env:
          ENV_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          ENV_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ENV_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set +x
          KEY="$(jq -r '.inputs.aws_access_key_id // empty' "$GITHUB_EVENT_PATH")"
          SECRET="$(jq -r '.inputs.aws_secret_access_key // empty' "$GITHUB_EVENT_PATH")"
          TOKEN="$(jq -r '.inputs.aws_session_token // empty' "$GITHUB_EVENT_PATH")"
          [ -n "${KEY}" ] && echo "::add-mask::${KEY}"
          [ -n "${SECRET}" ] && echo "::add-mask::${SECRET}"
          [ -n "${TOKEN}" ] && echo "::add-mask::${TOKEN}"
          if [ -z "${KEY}" ] || [ -z "${SECRET}" ] || [ -z "${TOKEN}" ]; then
            KEY="${ENV_KEY}"
            SECRET="${ENV_SECRET}"
            TOKEN="${ENV_TOKEN}"
          fi
          if [ -z "${KEY}" ] || [ -z "${SECRET}" ] || [ -z "${TOKEN}" ]; then
            echo "::error::Start Lab. Paste AWS Details on the form or set Environment academy secrets."
            exit 1
          fi
          echo "::add-mask::${KEY}"
          echo "::add-mask::${SECRET}"
          echo "::add-mask::${TOKEN}"
          {
            echo "AWS_ACCESS_KEY_ID=${KEY}"
            echo "AWS_SECRET_ACCESS_KEY=${SECRET}"
            echo "AWS_SESSION_TOKEN=${TOKEN}"
          } >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: actions/checkout@v7.0.1

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: RDS password for destroy refresh
        env:
          DB_PASS: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
        run: |
          set +x
          PLACEHOLDER="${DB_PASSWORD_PLAN_PLACEHOLDER}"
          if [ -n "${DB_PASS}" ] && [ "${DB_PASS}" != "${PLACEHOLDER}" ] && [ "${#DB_PASS}" -ge 8 ]; then
            PASS="${DB_PASS}"
          else
            PASS="${PLACEHOLDER}"
          fi
          echo "::add-mask::${PASS}"
          echo "TF_VAR_db_master_password=${PASS}" >> "$GITHUB_ENV"

      - name: terraform init
        env:
          BUCKET: ${{ needs.assert-lab.outputs.bucket }}
        working-directory: terraform/academy
        run: |
          set -euo pipefail
          if ! aws s3api head-bucket --bucket "${BUCKET}" 2>/dev/null; then
            echo "::error::State bucket ${BUCKET} is missing. Nothing to destroy. Do not create a backend on action=destroy."
            exit 1
          fi
          if ! terraform init -input=false -reconfigure \
            -backend-config="bucket=${BUCKET}" \
            -backend-config="key=estate/terraform.tfstate" \
            -backend-config="region=${AWS_DEFAULT_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"; then
            echo "::error::terraform init failed. Check S3 bucket ${BUCKET}."
            exit 1
          fi

      - name: Terminate estate EC2 so primary ENIs can be deleted
        run: |
          set -euo pipefail
          for asg in asg-portal asg-rest asg-haystack asg-neo4j; do
            aws autoscaling update-auto-scaling-group \
              --auto-scaling-group-name "${asg}" \
              --min-size 0 --desired-capacity 0 --max-size 0 \
              || echo "ASG ${asg} missing or already gone."
          done
          mapfile -t IDS < <(aws ec2 describe-instances \
            --filters \
              Name=tag:Stack,Values=estate \
              Name=instance-state-name,Values=pending,running,stopping,stopped \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text | tr '\t' '\n' | awk 'NF')
          if [ "${#IDS[@]}" -eq 0 ]; then
            echo "No estate EC2 left to terminate."
            exit 0
          fi
          echo "Terminating ${#IDS[@]} estate instance(s) so eth0 is released: ${IDS[*]}"
          aws ec2 terminate-instances --instance-ids "${IDS[@]}"
          aws ec2 wait instance-terminated --instance-ids "${IDS[@]}"
          echo "Estate EC2 terminated."

      - name: terraform destroy
        working-directory: terraform/academy
        run: |
          set -euo pipefail
          set +e
          terraform destroy -input=false -auto-approve -no-color > /tmp/tfdestroy.out 2>&1
          rc=$?
          cat /tmp/tfdestroy.out
          if [ "${rc}" -eq 0 ]; then
            set -euo pipefail
            {
              echo "### Terraform destroy"
              echo ""
              echo "Estate state emptied. S3 backend bucket **kept**."
              echo "Re-run \`action=apply\` to recreate (9 EC2, two Multi-AZ RDS, Bolt NLB)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if grep -q 'device index 0' /tmp/tfdestroy.out; then
            echo "Destroy hit a primary ENI. Dropping leftover ENI addresses from state and retrying."
            while read -r addr; do
              [ -n "${addr}" ] || continue
              terraform state rm "${addr}" || true
            done < <(terraform state list | grep -E 'aws_network_interface|aws_network_interface_attachment' || true)
            terraform destroy -input=false -auto-approve -no-color
            {
              echo "### Terraform destroy"
              echo ""
              echo "Retried after \`state rm\` of leftover ENI addresses. Backend bucket **kept**."
              echo "Re-run \`action=apply\` to recreate."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Terraform destroy failed"
            echo ""
            echo '```'
            grep -E '^Error:|  on |AccessDenied|UnauthorizedOperation|device index' /tmp/tfdestroy.out | head -n 40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::terraform destroy failed. See job summary."
          exit 1

  not-in-branch-2:
    name: Not implemented on branch 2
    if: inputs.action == 'configure-only' || inputs.action == 'stop'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail closed
        env:
          ACTION: ${{ inputs.action }}
        run: |
          echo "::error::action=${ACTION} is feat/infra-academy-configure (branch 3). This branch supports plan/bootstrap/apply/destroy."
          exit 1
